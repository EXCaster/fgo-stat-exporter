
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra desktop --group build --group dev

      - name: Build EXE
        run: uv run python tools/build_desktop.py --output build/desktop

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FGOStatDesktop-Windows
          path: build/desktop/candidate/
          if-no-files-found: error
          retention-days: 7
